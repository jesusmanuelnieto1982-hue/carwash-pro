<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Panel Admin – Carwash Pro</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="sidebar">
      <h2>Carwash Pro</h2>

      <ul>
        <li class="active"><a href="admin.html">Reservas</a></li>
        <li><a href="#">Clientes</a></li>
        <li><a href="services.html">Servicios</a></li>
        <li><a href="#">Reportes</a></li>
      </ul>
    </div>

    <div class="main-content">
      <button class="logout-btn" onclick="logout()">Cerrar sesión</button>

      <h1>Panel Admin – Carwash Pro</h1>
      <div class="stats-container">
        <div class="stat-card">
          <h3>Pendientes</h3>
          <p id="stat-pending">0</p>
        </div>
        <div class="stat-card">
          <h3>Confirmadas</h3>
          <p id="stat-confirmed">0</p>
        </div>
        <div class="stat-card">
          <h3>Completadas</h3>
          <p id="stat-completed">0</p>
        </div>
      </div>

      <div id="status"></div>

      <table id="bookingsTable">
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Teléfono</th>
            <th>Servicio</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Estado</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <!-- ORDEN CORRECTO DE SCRIPTS -->
      <!-- 1. Librería Supabase -->
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

      <!-- 2. auth.js (crea supabaseClient y protectAdmin) -->
      <script src="auth.js"></script>

      <!-- 3. admin.js (usa supabaseClient) -->
      <script src="admin.js"></script>

      <!-- 4. Ejecutar protección -->
      <script>
        protectAdmin();
      </script>
    </div>
    <!-- main-content -->
  </body>
</html>
